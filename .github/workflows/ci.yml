name: CI

# Full pipeline: lint + test the backend and frontend, build the unified
# single-container image, smoke-test it, then publish it to GHCR. Pushes to the
# default branch and version tags publish images; pull requests build and
# smoke-test only (no push).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: make setup

      - name: Lint & test (backend + frontend)
        run: make verify

  image:
    name: Build, smoke-test & push image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only authenticate when we intend to push (skips PRs, incl. forks).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name app-ci \
            -e JWT_SECRET=ci-smoke-test-secret \
            -e DATABASE_URL=sqlite+aiosqlite:////data/app.db \
            -p 8080:8080 app:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health >/dev/null; then
              echo "Health check passed"; ok=1; break
            fi
            sleep 2
          done
          docker logs app-ci
          docker rm -f app-ci >/dev/null
          if [ "$ok" != "1" ]; then echo "Health check failed"; exit 1; fi

      - name: Push image to GHCR
        # Reuses the cached layers from the build above; only runs off PRs.
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
