name: CI

on:
  push:
  pull_request:

jobs:
  # Lint and type-check need no database and finish in seconds, so they run as
  # their own job rather than delaying the suite behind a Postgres container.
  static:
    name: Backend (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: api/requirements.lock

      # The lock, not requirements-dev.txt: CI installs the exact resolved tree
      # (review.md R10), transitive deps pinned. requirements*.txt is the source;
      # requirements.lock is what gets installed.
      - name: Install dependencies
        run: pip install -r requirements.lock
        working-directory: api

      - name: Lint
        run: ruff check .
        working-directory: api

      - name: Type check
        run: mypy
        working-directory: api

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    # The suite runs against a real PostgreSQL (review.md 1C-3) — foreign keys,
    # check constraints and bulk UPDATEs are all exercised for real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: api/requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock
        working-directory: api

      - name: Run tests
        run: python -m pytest -q
        working-directory: api
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/pripritrip_test
          EVAL_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/pripritrip_evals

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Lint
        run: npm run lint
        working-directory: ui

      # `vitest run`, not `vitest` — the bare command watches, and a watcher in
      # CI hangs until the job times out (review.md R8).
      - name: Test
        run: npm run test:run
        working-directory: ui

      - name: Build
        run: npm run build
        working-directory: ui
