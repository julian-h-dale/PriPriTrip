[project]
name = "app-api"
version = "0.1.0"
description = "Starter FastAPI backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "C4", "RUF"]
# The formatter owns line length. B008 is FastAPI's Depends() pattern.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# conftest sets a test env var before importing the app.
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = ["app"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
