# Fully-resolved dependency lock (review.md R10). CI installs THIS file, so every
# build — local and CI — uses byte-identical package versions, transitive deps
# included. A floating minor can no longer turn an unrelated PR red.
#
# Versions are the exact tree that passes the 302-test suite locally; the package
# set is the clean transitive closure of requirements-dev.txt, so unused strays —
# alembic, pandas, psycopg2-binary, python-jose — are not in it.
#
# Do not hand-edit. To regenerate after changing requirements*.txt:
#
#   python3 -m venv /tmp/lockenv
#   /tmp/lockenv/bin/pip install -U pip
#   /tmp/lockenv/bin/pip install -r requirements-dev.txt
#   /tmp/lockenv/bin/pip freeze | grep -v '^pip==' > requirements.lock
#
# then run the suite once against it before committing.
