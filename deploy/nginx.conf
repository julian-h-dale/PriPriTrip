# nginx config for the unified single-container image.
#
# One public port (8080) fronts the whole app. Static UI assets are served
# directly; anything under /api is rewrite-and-stripped and reverse-proxied to
# the API on the loopback interface. The API's own routes are unprefixed
# (/auth, /users, /things, /health), so `/api/things/` -> `/things/`.
server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.html;

    # API: strip the /api prefix, then proxy to the loopback-only backend.
    location /api/ {
        # Journal photo uploads: originals up to 25 MB (nginx's default is 1 MB).
        client_max_body_size 26m;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA: the service worker, its registration script, the manifest, the
    # runtime config and the HTML entry must never be served from an HTTP
    # cache, or an installed app can stay stuck on an old version.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest|runtime-config\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite's hashed build assets never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: all other paths resolve to index.html for client-side routing.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
