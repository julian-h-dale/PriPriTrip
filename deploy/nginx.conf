# nginx config for the unified single-container image.
#
# One public port (8080) fronts the whole app. Static UI assets are served
# directly; anything under /api is rewrite-and-stripped and reverse-proxied to
# the API on the loopback interface. The API's own routes are unprefixed
# (/auth, /users, /things, /health), so `/api/things/` -> `/things/`.
server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.html;

    # API: strip the /api prefix, then proxy to the loopback-only backend.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: all other paths resolve to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
