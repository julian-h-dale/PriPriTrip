# Fly.io config for the unified single-container image.
# Rename the app and set your region, then: fly deploy
#
# Before first deploy, set the JWT secret (never bake it into the image):
#   fly secrets set JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')

app = "your-app-name"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Persist SQLite on the mounted volume (absolute path -> four slashes).
  DATABASE_URL = "sqlite+aiosqlite:////data/app.db"
  # Journal photos live on the same volume (grow it to ~10 GB first:
  # fly volumes extend <volume id> --size 10).
  PHOTO_DIR = "/data/photos"

[http_service]
  internal_port = 8080
  force_https = true
  # Cost control: let idle machines stop and start on demand.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# Persistent state lives on a volume that outlives the ephemeral machine.
# Create it once: fly volumes create data --size 1 --region <your-region>
[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
