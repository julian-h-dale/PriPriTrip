<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the installed app draws under the notch/home bar;
         safe-area padding keeps content clear of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12151c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PriPriTrip" />
    <title>PriPriTrip</title>
    <!-- Light or dark (src/shared/theme.js) and the text size
         (src/shared/textSize.js), chosen on this phone: applied before the
         first paint so the app never flashes the other one. -->
    <script>
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.classList.replace("dark", "light");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f8f9fb");
        }
        var size = { large: "112.5%", larger: "125%" }[localStorage.getItem("textSize")];
        if (size) document.documentElement.style.fontSize = size;
      } catch (e) {}
    </script>
    <!-- Runtime config injected at container start, outside the Vite bundle. -->
    <script src="/runtime-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
